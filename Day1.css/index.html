<!-- universal selector -->
<!-- (*)  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            color:red;
        }
    </style>
</head>
<body>
    <h1 style="color:red">Batch-99r</h1>
    <p>This is a simple paragraph</p>
    <a href="">click here</a>
</body>
</html>

<!-- only id selector -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1 id="first-hedding">Batch-99r</h1>
    <h1 id="first-hedding">Another hedding</h1>
    <p id="first-hedding">This is a simple paragraph</p>
    <a href="" id="first-hedding">click here</a>
    <p id="first-hedding">this is another paragraph</p>
    <a href="" id="first-hedding">some</a>

    
</body>
</html>
